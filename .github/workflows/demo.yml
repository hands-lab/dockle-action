name: Demo

on:
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test.yml'

jobs:
  demo:
    name: Self Action Demo
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2

      - name: Runs dockle action
        id: dockle
        uses: ./
        with:
          image: hello-world

      - name: Echo dockle execution result
        run: echo ${{ steps.dockle.outputs.result }}

      - name: Create Comment
        uses: actions/github-script@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ${{ steps.dockle.outputs.result }}
            })
